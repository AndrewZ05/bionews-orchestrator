[pytest]
# Scope a bare `pytest` (CI, a contributor, a cron) to the unit suite -- the
# hermetic, no-credentials tests we actually gate on -- so it behaves the same as
# our usual `pytest tests/unit`. This does NOT wander into:
#   - the git-ignored archive/ junk drawer (dormant scripts that import live
#     modules and error on collection),
#   - operational helper scripts named test_*.py that are __main__ scripts, not
#     pytest tests (e.g. shared/test_site_connectivity.py,
#     ops/test_gcs_bucket_permissions.py),
#   - tests/integration and tests/test_dcm_tpa_account.py, which require live
#     BigQuery / network / SSH credentials and are run deliberately by explicit
#     path, not as part of the default gate.
# Run those explicitly when you have the environment, e.g.:
#   pytest tests/integration
#   pytest tests/test_dcm_tpa_account.py
testpaths = tests/unit

# Defense in depth: never recurse into local/junk/build dirs even if a path is
# passed explicitly. Keeps collection deterministic across machines.
norecursedirs = archive scratch temp data logs exports reports models venv_test .git *.egg __pycache__ .pytest_cache

# Standard discovery patterns (the pytest defaults, stated explicitly).
python_files = test_*.py
python_classes = Test*
python_functions = test_*
